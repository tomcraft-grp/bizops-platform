<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2a78d6" />
    <!-- The name, description and icon below are filled in from src/brand.ts at build time (see vite.config.ts), so the name lives in one place -->
    <title>{{brand.name}}</title>
    <meta name="description" content="{{brand.name}} — {{brand.tagline}}" />
    <meta name="application-name" content="{{brand.name}}" />
    <meta name="apple-mobile-web-app-title" content="{{brand.shortName}}" />
    <meta property="og:site_name" content="{{brand.name}}" />
    <meta property="og:title" content="{{brand.name}}" />
    <meta property="og:description" content="{{brand.tagline}}" />
    <link rel="icon" href="{{brand.favicon}}" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
